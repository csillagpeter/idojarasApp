<h3>Időjárás előrejelzés</h3>
<div class="container py-4">
    <!-- Felső kereső és üdvözlő sáv -->
    <div class="row mb-4 align-items-center">
        <div class="col-md-6 text-white mb-3 mb-md-0">
            <h2 class="fw-bold mb-0">Üdvözlünk az Időjárás Központban!</h2>
            <p class="text-white-50 mb-0">Nézd meg a legfrissebb előrejelzéseket az adatbázisból.</p>
        </div>
        <div class="col-md-6">
            <div class="input-group shadow-sm">
                <input type="text" id="citySearchInput" class="form-control border-0 bg-white bg-opacity-75" placeholder="Keress várost... (pl. Budapest)">
                <button class="btn btn-primary" type="button" id="citySearchBtn">Keresés</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- MAI KIEMELT IDŐJÁRÁS KÁRTYA -->
        <div class="col-lg-5">
            <div class="card weather-card-main text-white h-100 border-0 shadow">
                <div class="card-body p-4 d-flex flex-column justify-content-between" id="mainWeatherContainer">
                    <!-- Ide töltődik be dinamikusan a kiválasztott nap kiemelt nézete -->
                    <div class="text-center py-5">Kérjük, válassz ki egy napot az előrejelzésből!</div>
                </div>
            </div>
        </div>

        <!-- RÉSZLETES METRIKÁK ÉS INFÓK -->
        <div class="col-lg-7">
            <div class="card glass-card h-100 border-0 shadow text-white">
                <div class="card-body p-4" id="detailedWeatherContainer">
                    <h5 class="fw-bold mb-4">Részletes adatok</h5>
                    <div class="text-center text-white-50 py-5">Kattints az alsó kártyák egyikére a részletekért.</div>
                </div>
            </div>
        </div>

        <!-- TÖBB NAPOS ELŐREJELZÉS -->
        <div class="col-12">
            <h4 class="text-white fw-bold mb-3 mt-2">Előrejelzés a következő napokra</h4>
            <div class="row g-3" id="forecastCardsContainer">
                <!-- Ide generálódnak a napok kártyái a JavaScript segítségével -->
            </div>
        </div>
    </div>
</div>
