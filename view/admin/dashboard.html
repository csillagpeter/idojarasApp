<h3>Dashboard</h3>
<hr>

<div class="row">
   
    <div class="col-lg-4 mb-3">
        <div class="card text-center p-3 h-100 shadow-sm">
            <h1 class="text-primary"><i class="bi bi-people-fill"></i></h1>
            <div class="card-body d-flex flex-column justify-content-center">
                <h1 id="totalUsers" class="display-4 fw-bold">0</h1>
                <p class="card-text text-muted">Total registered users</p>
            </div>
        </div>
    </div>

    
    <div class="col-lg-4 mb-3">
        <div class="card text-center p-3 h-100 shadow-sm">
            <h1 class="text-success"><i class="bi bi-box-arrow-in-right"></i></h1>
            <div class="card-body d-flex flex-column justify-content-center">
                <h1 id="totalLogins" class="display-4 fw-bold">0</h1>
                <p class="card-text text-muted">Total system logins</p>
            </div>
        </div>
    </div>

<!-- 3. KÁRTYA: TOP AKTÍV FELHASZNÁLÓK -->
    <div class="col-lg-4 mb-3">
        <div class="card text-center p-3 h-100 shadow-sm">
            <h1 class="text-warning"><i class="bi bi-trophy-fill"></i></h1>
            <div class="card-body">
                <p class="card-text fw-bold mb-2">Most Active Users</p>
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0" id="topUsers">
                        
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-5">
    <div class="col-12">
        <div class="card p-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0" id="formTitle">Új előrejelzés felvétele</h4>
                <button class="btn btn-sm btn-secondary hide" id="cancelEditBtn" onclick="resetForecastForm()">Mégse szerkesztés</button>
            </div>
            
            
            <form id="forecastForm" onsubmit="saveForecast(event)">
                <input type="hidden" id="forecastId" value="">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Dátum</label>
                        <input type="date" id="fDate" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Helyszín</label>
                        <input type="text" id="fLocation" class="form-control" placeholder="Pl. Baja" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Időjárás típusa</label>
                        <input type="text" id="fType" class="form-control" placeholder="Pl. Részben felhős" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">UV Index (0-10)</label>
                        <input type="number" id="fUv" class="form-control" min="0" max="10" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Min Temp (°C)</label>
                        <input type="number" id="fMin" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Max Temp (°C)</label>
                        <input type="number" id="fMax" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Szélsebesség (km/h)</label>
                        <input type="number" id="fWindS" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Szélirány</label>
                        <input type="text" id="fWindD" class="form-control" placeholder="Pl. ÉNY">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Páratartalom (%)</label>
                        <input type="number" id="fHum" class="form-control" min="0" max="100" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Légnyomás (hPa)</label>
                        <input type="number" id="fPress" class="form-control" placeholder="1015" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Csapadék mennyiség (mm)</label>
                        <input type="number" step="0.1" id="fPrecipM" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Csapadék esély (%)</label>
                        <input type="number" id="fPrecipP" class="form-control" min="0" max="100" required>
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-success px-4" id="submitForecastBtn">Mentés</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>


<div class="row mt-4">
    <div class="col-12">
        <div class="card p-4 shadow-sm">
            <h4 class="mb-3">Összes előrejelzés az adatbázisban</h4>
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Dátum</th>
                            <th>Helyszín</th>
                            <th>Típus</th>
                            <th>Min/Max</th>
                            <th>Pára / Légnyomás</th>
                            <th>Szél</th>
                            <th class="text-end">Műveletek</th>
                        </tr>
                    </thead>
                    <tbody id="adminForecastsTableBody">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
